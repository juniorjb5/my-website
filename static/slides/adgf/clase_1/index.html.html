# Antes de hablar de “modelos”…

Machine Learning suele sonar a “magia” porque lo vemos al final del proceso: un modelo que predice algo.
Pero en la vida real, ML es más simple (y más útil) si lo entendemos así:

- Hay un problema cotidiano (y un deseo de decidir mejor).

- Hay datos del pasado (ejemplos).

- Hay una máquina que busca patrones donde el humano ya no alcanza.



----

.center[
### La historia de Billy nos sirve para entender el nacimiento de ML sin tecnicismos.
]

# Este es Billy...

Billy quiere comprar un carro y decide hacer lo que hacemos todos: **mirar anuncios** y `“hacerse una idea”.`


No está tratando de ser científico: .orange[**solo quiere una estimación razonable para planear su ahorro.**]

- Revisa muchos anuncios en internet.

- Empieza a ordenar mentalmente precios según el año del carro.

- Y anota ejemplos típicos:

- Nuevo ≈ $20,000

- 1 año ≈ $19,000

- 2 años ≈ $18,000

- ... y así sucesivamente.

En este punto Billy no sabe nada de ML… pero ya está pensando como alguien que aprende de datos.



---



# Billy encuentra una “regla” simple

.pull-left[

Después de ver suficientes anuncios, Billy cree que encontró un patrón estable:

&gt; El precio depende de la edad del carro.

Cada año baja aproximadamente $1,000.

Y parece existir un “piso” donde ya no baja más, cerca de $10,000.


----


.center[
.orange[**Esta intuición es muy humana: buscamos una regla corta para explicar el mundo.**]

.blue2[Si esa regla funcionara siempre, la vida sería fácil...]
]


]


.pull-right[

.panelset[

.panel[.panel-name[Idea rápida]
Un patrón simple se siente poderoso porque nos permite decidir rápido:
“Si el carro es 3 años más viejo, debería costar ~3 mil menos”.

]

.panel[.panel-name[Mapa mental]

# Traducción a Machine Learning: “regresión”

En términos de ML, lo que Billy hizo tiene nombre:

**Regresión** = predecir un valor numérico (precio) usando datos históricos.

Ojo: esto no es algo “de laboratorio”.
La gente hace regresión intuitiva todo el tiempo, por ejemplo:

- Estimar un precio razonable para un iPhone usado.

- Decidir cuánto comprar para una parrillada (¿200g o 500g por persona?).

----

&gt; Lo interesante es que Billy lo hizo “a ojo” con pocos factores...
pero el mundo real casi nunca se deja reducir a una sola variable.


---

# El mundo real entra a escena


&lt;img src="img/img5.png" width="60%" style="display: block; margin: auto;" /&gt;


---


# El problema: no existe una fórmula para todo

Sería increíble tener una fórmula simple para cualquier problema del mundo.
Pero con carros (y con casi todo) aparece la complejidad:

- No todos los carros “de 2 años” son comparables: pueden tener distintos meses de fabricación.

- Hay decenas de opciones y versiones (extras, motor, transmisión).

- La condición técnica cambia todo (kilometraje, choques, mantenimiento).

- Hay picos de demanda por temporada.

- Y existen factores ocultos que ni siquiera sabemos medir bien.

----

&gt; Entonces, la regla de Billy empieza a fallar:

&gt; no porque sea “mala”, sino porque es **demasiado simple para un sistema complejo.**


---

# Limitación humana (y la razón práctica de ML)

.pull-left[

Un Billy promedio no puede sostener todas esas variables y relaciones en la cabeza al mismo tiempo.
Y aunque alguien lo intente con cuidado, el cerebro tiende a:

- simplificar demasiado,

- olvidar factores,

- sesgarse por ejemplos recientes,

- y “cerrar” la decisión con poca evidencia.

En pocas palabras: cuando el problema tiene muchos factores,
necesitamos un método que pueda procesarlos sistemáticamente.

]

.pull-right[



&lt;img src="img/img6.png" width="90%" style="display: block; margin: auto;" /&gt;




]

# La idea de Machine Learning (en una receta)

En vez de inventarnos una fórmula a mano, hagamos lo computacional:

1. Recolectamos datos (muchos anuncios con precio + características).

2. Le pedimos a la máquina que encuentre patrones ocultos relacionados con el precio.

3. Usamos esos patrones para predecir mejor.

&lt;br&gt;
&lt;br&gt;

----

&lt;br&gt;
&lt;br&gt;



&gt; Esto no elimina la incertidumbre, pero sí mejora dos cosas:

&gt; - La consistencia (no depende del “ánimo” del analista),

&gt; - y la capacidad de capturar relaciones complejas.

# Aquí “nace” ML

Lo emocionante es que, con datos suficientes, la máquina puede predecir precios
mejor que una persona tratando de analizar todo mentalmente.

Ese es el origen práctico de ML:

- No es magia.

- No es solo “algoritmos”.

- Es un enfoque para aprender patrones desde datos cuando el mundo es complejo.


### Antes de hablar de modelos, necesitamos entender la base: **el dato.**




---


# La idea central

Machine Learning no es “un algoritmo mágico”.

Es un sistema que funciona **solo si** se alinean tres piezas:

1. **Datos** (lo que observamos del mundo)  
2. **Features** (cómo representamos ese mundo en variables)  
3. **Algoritmos** (cómo aprende el patrón)


&lt;br&gt;&lt;br&gt;

----

&lt;br&gt;&lt;br&gt;

.center[
.font140[.orange[**Si una de las tres falla, el resultado falla.**]]
]

---


# Una metáfora rápida

.pull-left[

Piensa en ML como cocinar:

- **Datos** = ingredientes  
- **Features** = cómo los cortas / mezclas / preparas  
- **Algoritmo** = la receta + técnica de cocción

Si los ingredientes están dañados,  
no hay receta que salve el plato 😅

&lt;br&gt;

----

&lt;br&gt;

.center[
.font130[.blue2[**Garbage in → garbage out**]]
]

# Componente 1: Datos (Data)

Los datos son ejemplos del pasado.
No son “la verdad”, son una medición (con ruido, sesgos y errores).

.panelset[

.panel[.panel-name[Qué incluye “datos”]

- ¿De dónde vienen? (fuente)

- ¿Cómo se capturan? (manual / automático)

- ¿Qué tan completos están? (faltantes)

- ¿Qué tan consistentes son? (fechas, unidades, llaves)

- ¿En qué contexto se midieron? (reglas del negocio)
]

.panel[.panel-name[Finanzas]

&gt; .font130[**En finanzas, el dato “malo” no solo reduce precisión: genera decisiones equivocadas y puede costar plata.**]

]

]


---

# Datos: manual vs automático

.pull-left[

Cuando se capturan datos, hay dos mundos:

**Manual**

- más lento

- puede tener errores humanos (digitación)

- suele tener validación por sentido común


**Automático**

- más rápido y masivo

- pero también mete errores silenciosos:

- sensores, scrapers, logs

- cambios de formato

- duplicados por integración

- valores fuera de escala


]

.pull-right[

&lt;img src="img/img9.png" width="95%" style="display: block; margin: auto;" /&gt;

.center[
.orange[Más datos ≠ mejores datos]
]

]



---


# Componente 2: Features (representación)

Un dato crudo rara vez sirve directo.

**Features** son la forma en que convertimos el mundo en números/variables:

- Edad del carro (ok)

- Kilometraje (mejor)

- Estado / extras (mejor)

- Estacionalidad (mes, semana)

- Ciudad / zona (mercado local)


----

&gt; En la práctica, una gran parte del trabajo real en ML ocurre aquí.


---



# Features: el mismo dato, distinto significado

.panelset[

.panel[.panel-name[Ejemplo simple]
Precio = 18,000
Eso solo no dice mucho…

Pero si lo acompañas de:

- edad = 2 años

- km = 35,000

- transmisión = automática

- ciudad = Cali

- mes = diciembre

...ya puedes explicar “por qué” ese precio puede ser razonable.
]

.panel[.panel-name[Finanzas]

En finanzas es igual:

- retornos (feature) salen de precios (dato)

- ratios financieros salen de estados financieros

- riesgo (VaR/ES) sale de series limpias y consistentes

.orange[**Sin features bien definidas, el modelo aprende basura.**]
]

]

---

# Componente 3: Algoritmos

Aquí viven las “familias” que todo el mundo menciona:

- Regresión / Clasificación

- Árboles / SVM / KNN

- Redes neuronales

- Ensambles, etc.

Pero ojo:

.orange[El algoritmo es la parte más visible... pero no siempre la más importante.]

.center[
.blue2[**Con buen dato + buenas features, incluso modelos simples funcionan muy bien.**]
]

---

# En proyectos reales

.pull-left[

En el mundo real, el orden de prioridad suele ser:

1. Datos correctos y trazables

2. Features coherentes con el negocio

3. Luego sí eliges el algoritmo

----

.orange[**Si inviertes el orden (arrancas por “modelo”), terminas “arreglando” el proyecto al final, cuando ya es tarde.**]

]

# Learning vs Intelligence

Machine Learning es **parte** de la Inteligencia Artificial, pero no es “toda la IA”.

- **AI**: campo completo (como biología o química)
- **ML**: una parte de AI que aprende patrones desde datos
- **Neural Networks**: un tipo de ML (popular, pero no el único)
- **Deep Learning**: enfoque moderno/arquitecturas para redes (hoy se usa casi como sinónimo práctico)

----

.center[
.orange[**Regla de oro:** no compares categorías que están en “niveles” distintos, porque suena a marketing y confunde.]
]

- Mal: **“¿Qué es mejor: AI o redes neuronales?”**

(AI es el campo grande; redes neuronales es una técnica dentro de ML, que está dentro de AI)

- Mal: **“¿Uso Machine Learning o Deep Learning?”**

(Deep Learning es un subconjunto de ML, no una alternativa del mismo nivel)



---

# “La máquina aprende” ≠ “la máquina es inteligente”

.pull-left[
La máquina puede **aprender patrones**... pero eso no significa que tenga “inteligencia humana”.

**Machine can**
- Forecast / predecir
- Memorize / aprender de ejemplos
- Reproduce / automatizar una tarea
- Choose best item / optimizar un criterio

**Machine cannot**
- Create something new (sin contexto/humano)
- Get smart really fast (sin datos/entrenamiento)
- Go beyond their task (sin re-definir objetivo)
- “Kill all humans” (dejemos a Hollywood 😅)

----

.center[
.blue2[En analítica: “aprender” = ajustar a datos; “inteligencia” = otra conversación.]
]
]

# El mapa del ML world


.pull-left[
Cuando alguien dice “hago ML”, puede estar hablando de cosas muy distintas.  
Por eso sirve un mapa: **ubicar familias** y entender que no existe “un solo ML”.

**Tres preguntas para orientarnos:**
- ¿Tengo una etiqueta/objetivo `Y`? .orange[(sí → supervisado / no → no supervisado)]
- ¿Estoy optimizando por trial–error con recompensas? .orange[(→ reinforcement learning)]
- ¿Necesito combinar muchos modelos para mejorar? .orange[(→ ensembles)]

----

.center[
.orange[**Idea clave:** el método depende del problema, los datos y la restricción del negocio.]
]
]

La tecnología de big data o el análisis de grandes conjuntos de datos, se está convirtiendo en un aspecto clave de:


1. La competitividad de las empresas
2. El aumento de la productividad y el crecimiento
3. La innovación
4. La satisfacción del consumidor

# Transparencia

Desde el funcionamiento interno de las empresas hasta la gestión de nuestras sociedades, el análisis de datos permite alcanzar altos niveles de transparencia. 


.center[
*“En un mundo ideal, la transparencia debe aplicarse a todas las etapas del trabajo con datos".*
]

.pull-left[

&lt;img src="https://media.giphy.com/media/3o6MbglpHAmtq6rvZS/giphy.gif" width="90%"/&gt;

]


.pull-right[

Las partes implicadas deben estar informadas sobre los fines de los datos capturados:

- ¿cómo se recopilan, almacenan, transfieren o procesan? 

- También se les debe informar sobre la forma en que se analizarán los datos si algún tercero participa en el procesamiento de datos. 

- Los usuarios deben recibir garantías claras de que los datos no se venderán ni se transferirán a otras instituciones o entidades legales sin el consentimiento adecuado.

]

# Analítica de Datos para la Gestión Financiera
## “Del hype (ML/Big Data) al trabajo real: el dato”

---

# ¿Qué es “analítica de datos” en gestión financiera?

En finanzas, analítica no es “hacer un modelo” solamente.  
Es construir un proceso confiable para responder preguntas como:

- ¿Cómo se comporta el rendimiento y el riesgo de un activo / portafolio?
- ¿Cómo evoluciona la liquidez, solvencia o rentabilidad de una empresa?
- ¿Qué señales tempranas hay de estrés financiero?

----

.center[
.orange[**El insumo real es el dato: limpio, trazable, consistente.**]
]

---

# El flujo analítico (vista de ingeniería)

**Problema → Dato → Integración → Calidad → Métrica/Modelo → Decisión**

.panelset[
.panel[.panel-name[Pregunta guía]
Si mañana te cambian la base de datos o llega un nuevo periodo,
¿puedes reproducir exactamente el dataset final y el resultado?
]
.panel[.panel-name[Objetivo del curso]
Que tu respuesta sea: **sí**, porque tienes un pipeline documentado.
]
]

---

# Dos mundos de datos financieros

.pull-left[
## Mercado
Datos que reflejan precios y condiciones de negociación.

- Precios (close, open, high, low)
- Volúmenes, spreads, liquidez
- Tasas de interés, FX, commodities
- Indicadores: retornos, volatilidad, VaR

**Preguntas típicas:** riesgo, cobertura, asignación, timing.
]

.pull-right[
## Corporativo
Datos que describen la salud financiera de empresas.

- Estados financieros (balance, P&amp;G, flujo de caja)
- Razones financieras (ROA, ROE, margen, endeudamiento)
- Cuentas por cobrar/pagar, inventarios, CAPEX

**Preguntas típicas:** desempeño, solvencia, planeación y control.
]

---

# Clasifica variables

¿Cuáles son de mercado y cuáles son corporativas?

- Precio de cierre, volumen, tasa de cambio, beta, EBITDA, deuda total, caja, margen neto

.panelset[
.panel[.panel-name[Respuesta]
**Mercado:** precio de cierre, volumen, tasa de cambio, beta  
**Corporativo:** EBITDA, deuda total, caja, margen neto
]
.panel[.panel-name[Mensaje]

**con qué frecuencia** llegan,
y **qué llaves** necesitas para integrarlas.
]
]

# Estructuras de datos: serie de tiempo vs panel

.pull-left[
## Serie de tiempo
Una entidad a través del tiempo.

- Un activo: `precio_t`
- Una empresa: `EBITDA_t`
- Un país: `inflación_t`

**Llave típica:** `fecha`
]

.pull-right[
## Panel
Muchas entidades a través del tiempo.

- Muchas acciones por día: `id_activo × fecha`
- Muchas empresas por trimestre: `firma × periodo`
- Países por mes: `pais × fecha`

**Llaves típicas:** `(id, fecha)`
]

---

# Frecuencia importa

Mercado suele ser:
- diaria, intradía (minutos/segundos)

Corporativo suele ser:
- trimestral, anual (a veces mensual interno)

**Riesgo típico:** mezclar frecuencias sin control.

&gt; Ejemplo: unir precios diarios con estados trimestrales “como si fuera lo mismo”
genera duplicados o valores repetidos artificialmente.

---

# Mini-caso: unir mercado (diario) con corporativo (trimestral)

Si tienes:
- precios diarios de una acción (365 filas/año)
- estado financiero trimestral (4 filas/año)

Pregunta: ¿qué pasa si haces un join solo por `id`?


--


.panelset[
.panel[.panel-name[Respuesta corta]
Explota la tabla: el dato trimestral se replica en todos los días
y puedes terminar duplicando o “inyectando” información donde no corresponde.
]
.panel[.panel-name[Regla práctica]
Antes de unir: define la **frecuencia objetivo** del análisis.
- Si quieres análisis diario: debes decidir cómo “llevar” lo trimestral a diario (y justificarlo).
- Si quieres análisis trimestral: debes agregar/resumir lo diario a trimestre.
]
]

# Importación e integración (en R)
## Llaves, joins, duplicados, faltantes, unidades/monedas/fechas

---

# Paso 1: Importación (import) con control

En el mundo real, el dolor no es `read_csv()`, sino:

- encoding y separadores (coma vs punto y coma)
- nombres raros de columnas
- tipos mal leídos (fechas como texto, números como caracteres)
- separadores de miles/decimales

----

.center[
.orange[**Importar es tipificar. Si no tipificas, todo lo demás se contamina.**]
]

---

# ¿Qué error ves?

Te llega una columna `price` como texto:

- `"19,000"`  
- `"20.000"`  
- `"$18,500"`  

Pregunta: ¿es el mismo formato? ¿es el mismo número?

.panelset[
.panel[.panel-name[Claves]
- separador de miles vs decimal  
- símbolo de moneda  
- consistencia del formato  
Si no limpias esto, tus retornos salen absurdos.
]
]

---

# Paso 2: Llaves (keys): la decisión más importante

En datos financieros, una llave mal definida te destruye el dataset.

Ejemplos de llaves típicas:
- Mercado: `(ticker, fecha)`
- FX: `(par_moneda, fecha)`
- Corporativo: `(firma, periodo)`
- Transaccional: `(id_cliente, fecha_hora, id_transaccion)`

----

.center[
.blue2[Antes de hacer joins, escribe tu llave en una frase.]
]

---

# Paso 3: Joins (uniones) — el lugar donde nacen los duplicados

Tipos de joins (idea):
- `left_join()`: conservo mi tabla base
- `inner_join()`: solo intersección
- `full_join()`: todo, con faltantes

Riesgo #1: **many-to-many accidental**
- si ambas tablas tienen repetidos en la llave, el join “multiplica” filas.

---

# Predice qué pasa

Tabla A: precios diarios (ticker, fecha) — única por llave.  
Tabla B: noticias (ticker, fecha) — puede tener **varias** noticias por día.

Si haces `left_join(A, B, by=c("ticker","fecha"))`:

--

.panelset[
.panel[.panel-name[Respuesta]
El precio del día se va a repetir tantas veces como noticias existan ese día.
Eso NO es “malo” si tu unidad de análisis es “noticia”.
Pero es un desastre si tu unidad de análisis es “día”.
]
.panel[.panel-name[Regla]
Primero define la **unidad de análisis**:
día, transacción, cliente, firma-trimestre…
Luego ajustas la tabla (agregas B o cambias el modelo).
]
]

---

# Paso 4: Duplicados (y cómo se generan)

Duplicados típicos en finanzas:
- mismo registro repetido (carga doble)
- join que explota filas
- fechas duplicadas por zona horaria / mercado

Chequeo mental:
&gt; “¿Debería existir más de una fila por (ticker, fecha)?”

Si la respuesta es no → entonces tu dataset tiene un problema.

---

# Checklist de duplicados

Si tu unidad es diaria por activo, entonces:

- ¿existe más de una fila por `(ticker, fecha)`?
- ¿cuántas? ¿en qué fechas? ¿por qué?



.panelset[
.panel[.panel-name[Interpretación]
Duplicados ≠ “un error pequeño”.  
Duplicados = retornos duplicados, volatilidad falsa,
VaR inflado/deflactado, y decisiones erróneas.
]
]

---

# Paso 5: Faltantes (NA) — no siempre son “malos”, pero sí peligrosos

Tipos de faltantes:
- faltante real (no existe dato)
- faltante por falla de captura
- faltante por join mal hecho

En finanzas:
- `NA` en precio rompe retornos
- `NA` en estados financieros rompe ratios
- `NA` en tasas rompe descuento/valuación

---

# NA en precios

Si un precio está NA en medio de la serie:

- tu retorno de ese día es NA  
- y el retorno del día siguiente depende de ese NA  
- puedes “perder” ventanas completas de cálculo

**Regla:** antes de modelar, decide:
- eliminar, imputar, interpolar, o marcar y excluir por periodos
… y documenta la decisión.

---

# Paso 6: Unidades, moneda y fechas (los tres asesinos silenciosos)

**Unidades:** miles vs millones, % vs proporción  
**Moneda:** COP vs USD, nominal vs real  
**Fechas:** formato, zona horaria, días hábiles vs calendario

----

.center[
.orange[**La mayoría de errores graves en finanzas son “formato”, no matemática.**]
]

---

# Mini-ejercicio (2 min): identifica el bug

Tasa de interés: `5`  
- ¿Es 5% o es 5 (500%)?

FX: `4000`  
- ¿COP/USD o USD/COP?

Fecha: `01/02/2025`  
- ¿1 de febrero o 2 de enero?

.panelset[
.panel[.panel-name[Moraleja]
Sin diccionario de variables y reglas de formato,
tú y tu equipo pueden leer lo mismo… y entender cosas distintas.
]
]

---

class: inverse, center, middle
background-color: #122140

# Validaciones, trazabilidad y diccionario
## Quality gate + pipeline reproducible

---

# Quality gate: validaciones mínimas antes de analizar

Antes de calcular retornos, ratios o riesgo, valida:

- Llaves únicas (unidad de análisis)
- Rangos lógicos (precios &gt; 0, tasas razonables)
- Consistencia de moneda y unidades
- Fechas ordenadas y sin huecos “raros”
- NA bajo control (reglas explícitas)

----

.center[
.blue2[Estas validaciones son parte del pipeline, no una “revisión manual”.]
]

---

# Trazabilidad: ¿de dónde salió este número?

Trazabilidad significa que puedas responder:

- ¿qué fuente lo generó?
- ¿qué transformaciones se aplicaron?
- ¿qué filas se filtraron y por qué?
- ¿qué versión de datos/código lo produjo?

En proyectos reales, esto separa:
- análisis “bonito” (no repetible)
- de análisis profesional (auditables).

---

# Diccionario de variables (mínimo viable)

Para cada variable define:

- nombre (en el dataset)
- descripción en español
- unidad (USD, COP, %, ratio)
- frecuencia (diaria, mensual, trimestral)
- fuente (sistema, API, proveedor)
- reglas de validación (rangos, NA permitido)
- llave / nivel (ticker-fecha, firma-periodo)

----

.center[
.orange[**Sin diccionario, no hay proyecto: hay solo archivos sueltos.**]
]

---

# Mini-ejercicio (5 min): crea tu mini-diccionario

Toma 5 variables típicas y define:

1) nombre en dataset  
2) descripción  
3) unidad/moneda  
4) frecuencia  
5) nivel (llave)

Ejemplos:
- `close`, `volume`, `ret`, `fx_usdcop`, `debt_total`

.panelset[
.panel[.panel-name[Entrega]
En grupos: un diccionario de 5 variables en una tabla (puede ser Google Sheets).
]
.panel[.panel-name[Evaluación rápida]
¿Se entiende sin que tú lo expliques?
Si la respuesta es no, falta detalle.
]
]

---

# Pipeline reproducible (en una frase)

**Importar → limpiar → integrar → validar → documentar → analizar**

.panelset[
.panel[.panel-name[Lo que haremos en R]
- `readr`/`readxl` para importar  
- `dplyr` para limpiar e integrar  
- funciones de validación (reglas)  
- outputs reproducibles (dataset final + reporte)
]
.panel[.panel-name[Mensaje final]
Cuando lleguemos a modelos (ML), ya tendremos confianza
en que el patrón viene del mundo… no de errores del dataset.
]
]

---



# Taller 1 (10%) — Flujo de datos y calidad

**Objetivo:** entregar un *dataset analítico* listo para usar en el **Taller 2 (EDA + inferencia + visualización)**. 


Aquí NO evaluamos “modelos”: evaluamos **calidad, trazabilidad y reproducibilidad**.

----

## 1) Elige una ruta de datos (una sola)

.pull-left[
### Ruta A — Mercado
- 7-10 activos (acciones/ETF/índice/etc)  
- ventana: 3–5 años (ideal: diaria)  

**Llave:** `ticker + date`
]

.pull-right[
### Ruta B — Corporativo
- Empresas  
- 8–12 trimestres (o meses, o años)  
- variables de estados financieros/ratios

**Llave:** `empresa + periodo`
]

---



.pull-left[

## 2) Entregables (1 archivo)

1) **Reporte reproducible** 
   - Generado con Rmd/Quarto/Streamlit/etc.
   
2)  El reporte debe de mostar el camino desde el **Dataset inicial** hasta **Dataset final**  
   
3) **Diccionario mínimo**  
   - nombre, descripción, unidad/moneda, frecuencia, fuente, llave/nivel, etc.



]

.pull-right[


## 3) Checks de calidad (obligatorios)

- **Llave única:** sin duplicados en la llave  
- **Tipos correctos:** fechas como `Date`, números como numéricos  
- **Missing controlado:** conteo de NA + decisión (eliminar/imputar/marcar)  
- **Unidades/moneda consistentes:** una sola convención + nota si transformaste  
- **Rangos lógicos:** valores imposibles detectados (precio&gt;0, tasas razonables, etc.)  
- **Bitácora:** “qué cambié y por qué” (trazabilidad)

]

---

Si la IA les da código, ustedes siguen siendo responsables de entenderlo y documentarlo.”
